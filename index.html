<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SFS Business Management - Ledgers</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; padding: 20px; }
        .card { margin-bottom: 20px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .loader { display: none; text-align: center; padding: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="text-center mb-4">SFS Business Management - Ledger Portal</h2>
        
        <!-- File Selector -->
        <div class="row mb-3">
            <div class="col-md-6 offset-md-3">
                <label for="ledgerSelect" class="form-label"><b>Select Ledger File:</b></label>
                <select id="ledgerSelect" class="form-select" onchange="fetchLedgerData()">
                    <option value="Customer">Customer & Supplier Ledger</option>
                    <option value="Hamza">HAMZA ELEC</option>
                    <option value="Invertor">Ledger INVERTOR</option>
                </select>
            </div>
        </div>

        <!-- Loader -->
        <div id="loader" class="loader">
            <div class="spinner-border text-primary" role="status"></div>
            <p class="mt-2">Loading data from Google Apps Script...</p>
        </div>

        <!-- Data Table Card -->
        <div class="card">
            <div class="card-body">
                <h4 id="tableTitle" class="card-title mb-3">Ledger Records</h4>
                <div class="table-responsive">
                    <table class="table table-striped table-bordered" id="ledgerTable">
                        <thead class="table-dark" id="tableHeader"></thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // APNA GOOGLE APPS SCRIPT WEB APP URL YAHAN PASTE KAREIN
        const API_URL = "YOUR_GOOGLE_APPS_SCRIPT_WEB_APP_URL_HERE";

        function fetchLedgerData() {
            const sheetName = document.getElementById('ledgerSelect').value;
            document.getElementById('loader').style.display = 'block';
            document.getElementById('tableHeader').innerHTML = '';
            document.getElementById('tableBody').innerHTML = '';

            fetch(`${API_URL}?sheet=${sheetName}`)
                .then(response => response.json())
                .then(data => {
                    document.getElementById('loader').style.display = 'none';
                    if (data.error) {
                        alert("Error: " + data.error);
                        return;
                    }
                    displayTable(data);
                })
                .catch(error => {
                    document.getElementById('loader').style.display = 'none';
                    console.error('Error fetching data:', error);
                    alert('Failed to connect to backend.');
                });
        }

        function displayTable(rows) {
            if (rows.length === 0) {
                document.getElementById('tableBody').innerHTML = '<tr><td colspan="100" class="text-center">No data found</td></tr>';
                return;
            }

            // Headers
            let headers = Object.keys(rows[0]);
            let headerHtml = '<tr>';
            headers.forEach(h => { headerHtml += `<th>${h}</th>`; });
            headerHtml += '</tr>';
            document.getElementById('tableHeader').innerHTML = headerHtml;

            // Rows
            let bodyHtml = '';
            rows.forEach(row => {
                bodyHtml += '<tr>';
                headers.forEach(h => {
                    bodyHtml += `<td>${row[h] !== undefined ? row[h] : ''}</td>`;
                });
                bodyHtml += '</tr>';
            });
            document.getElementById('tableBody').innerHTML = bodyHtml;
        }

        // Initial load
        window.onload = fetchLedgerData;
    </script>
</body>
</html>
