<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Arham Electronics ERP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=20261028-qs2">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">AE</div>
        <div class="brand-copy"><b>Arham</b><span>Electronics</span></div>
      </div>
      <div class="nav-caption">Workspace</div>
      <nav>
        <button class="nav nav-quick" data-page="quicksale"><span class="nav-icon">+</span><span>Quick Sale</span></button>
        <button class="nav active" data-page="dashboard"><span class="nav-icon">⌂</span><span>Dashboard</span></button>
        <button class="nav" data-page="products"><span class="nav-icon">▦</span><span>Products</span></button>
        <button class="nav" data-page="stock"><span class="nav-icon">▥</span><span>Stock</span></button>
        <button class="nav" data-page="customers"><span class="nav-icon">♙</span><span>Customers</span></button>
        <button class="nav" data-page="suppliers"><span class="nav-icon">♧</span><span>Suppliers</span></button>
        <div class="nav-caption nav-caption-space">Transactions</div>
        <button class="nav" data-page="sales"><span class="nav-icon">↗</span><span>Sales</span><span class="nav-dot"></span></button>
        <button class="nav" data-page="purchases"><span class="nav-icon">↙</span><span>Purchases</span></button>
        <button class="nav" data-page="payments"><span class="nav-icon">₨</span><span>Payments</span></button>
        <button class="nav" data-page="expenses"><span class="nav-icon">◈</span><span>Expenses</span></button>
        <button class="nav" data-page="incentives"><span class="nav-icon">★</span><span>Incentive Report</span></button>
        <div class="nav-caption nav-caption-space">Reports</div>
        <button class="nav" data-page="reports"><span class="nav-icon">▤</span><span>Reports</span></button>
        <div class="nav-caption nav-caption-space">System</div>
        <button class="nav" data-page="settings"><span class="nav-icon">⚙</span><span>Settings</span></button>
        <button class="nav" data-page="import"><span class="nav-icon">⇪</span><span>Import</span></button>
      </nav>
      <div class="side-note">
        <span class="online-dot"></span><div><b>System Online</b><small>Google Sheets Database</small></div>
      </div>
    </aside>
    <main class="main">
      <header class="topbar">
        <div class="topbar-left">
          <button class="mobile-menu" type="button" aria-label="Menu">☰</button>
          <div><h1 id="pageTitle">Dashboard</h1><div class="crumb">Arham Electronics <b>/</b> <span id="crumb">Dashboard</span></div></div>
        </div>
        <div class="topbar-actions">
          <div class="system-status"><span class="online-dot"></span> Live</div>
          <button id="refreshBtn" class="btn secondary refresh-btn">↻ <span>Refresh</span></button>
        </div>
      </header>
      <section id="toast" class="toast hidden"></section>
      <section id="content"></section>
    </main>
  </div>
  <script src="app.js?v=20261028-qs2"></script>
</body>
</html>
