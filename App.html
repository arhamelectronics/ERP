<script>
const state={page:'dashboard',products:[],customers:[],suppliers:[],stock:[],ledger:[]};
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const money=v=>Number(v||0).toLocaleString('en-PK',{minimumFractionDigits:2,maximumFractionDigits:2});
function toast(msg){const x=$('#toast');x.textContent=msg;x.classList.remove('hidden');setTimeout(()=>x.classList.add('hidden'),2500)}
function call(name,...args){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[name](...args)})}
async function load(){
  $('#content').innerHTML='<div class="loading">Loading...</div>';
  try{if(state.page==='dashboard')await dashboard();if(state.page==='products')await products();if(state.page==='stock')await stock();if(state.page==='customers')await customers();if(state.page==='suppliers')await suppliers();if(state.page==='ledger')await ledger();}
  catch(e){$('#content').innerHTML='<div class="panel danger">Error: '+esc(e.message||e)+'</div>';}
}
async function dashboard(){const d=await call('apiDashboard');$('#content').innerHTML=`<div class="content"><div class="grid cards">
<div class="card"><div class="label">Products</div><div class="value">${d.productCount}</div><div class="sub">Active database records</div></div>
<div class="card"><div class="label">Customers</div><div class="value">${d.customerCount}</div><div class="sub">Customer accounts</div></div>
<div class="card"><div class="label">Suppliers</div><div class="value">${d.supplierCount}</div><div class="sub">Supplier accounts</div></div>
<div class="card"><div class="label">Stock Qty</div><div class="value">${money(d.stockQty)}</div><div class="sub">Current total quantity</div></div></div>
<div class="grid cards"><div class="card"><div class="label">Stock Value</div><div class="value">${money(d.stockValue)}</div><div class="sub">At purchase cost</div></div><div class="card"><div class="label">Low Stock</div><div class="value">${d.lowStockCount}</div><div class="sub">At or below minimum</div></div><div class="card"><div class="label">Sales</div><div class="value">${money(d.salesTotal)}</div><div class="sub">Posted sales total</div></div><div class="card"><div class="label">Purchases</div><div class="value">${money(d.purchasesTotal)}</div><div class="sub">Posted purchases total</div></div></div>
<div class="panel"><div class="panel-head"><h2>ERP Status</h2><button class="btn secondary" onclick="load()">Refresh</button></div><div class="split"><div><b>Database:</b> Google Sheets</div><div><b>Backend:</b> Apps Script</div><div><b>Stock source:</b> StockMovements</div><div><b>Login:</b> Deferred for now</div></div></div></div>`}
async function products(){state.products=await call('apiProducts');renderProductTable(state.products)}
function renderProductTable(rows){$('#content').innerHTML=`<div class="content"><div class="panel"><div class="panel-head"><h2>Products (${rows.length})</h2><div class="toolbar"><input id="search" class="search" placeholder="Search code, product, brand..." oninput="filterProducts()"><button class="btn secondary" onclick="products()">↻</button></div></div><div class="table-wrap"><table class="table"><thead><tr><th>Code</th><th>Description</th><th>Brand</th><th>Category</th><th>Unit</th><th>Stock</th><th>Purchase</th><th>Sale</th><th>Min</th></tr></thead><tbody id="productRows"></tbody></table></div></div></div>`;drawProducts(rows)}
function filterProducts(){const q=$('#search').value.toLowerCase();drawProducts(state.products.filter(p=>Object.values(p).join(' ').toLowerCase().includes(q)))}
function drawProducts(rows){$('#productRows').innerHTML=rows.slice(0,500).map(p=>`<tr><td><b>${esc(p.Code||p.ProductID)}</b></td><td>${esc(p.Description)}</td><td>${esc(p.Brand)}</td><td>${esc(p.Category)}</td><td>${esc(p.Unit)}</td><td class="${Number(p.CurrentStock)<=Number(p.MinStock)&&Number(p.MinStock)>0?'status-low':''}">${esc(p.CurrentStock)}</td><td>${money(p.PurchasePrice)}</td><td>${money(p.SalePrice)}</td><td>${esc(p.MinStock)}</td></tr>`).join('')||'<tr><td colspan="9" class="empty">No products found</td></tr>'}
async function stock(){state.stock=await call('apiStock','');const rows=state.products.length?state.products:await call('apiProducts');$('#content').innerHTML=`<div class="content"><div class="panel"><div class="panel-head"><h2>Current Stock</h2><input id="search" class="search" placeholder="Search product..." oninput="filterStock()"></div><div class="table-wrap"><table class="table"><thead><tr><th>Code</th><th>Description</th><th>Brand</th><th>Current Stock</th><th>Min Stock</th><th>Purchase Price</th><th>Stock Value</th></tr></thead><tbody id="stockRows"></tbody></table></div></div></div>`;state.products=rows;drawStock(rows)}
function filterStock(){const q=$('#search').value.toLowerCase();drawStock(state.products.filter(p=>Object.values(p).join(' ').toLowerCase().includes(q)))}
function drawStock(rows){$('#stockRows').innerHTML=rows.map(p=>{const q=Number(p.CurrentStock)||0,c=Number(p.PurchasePrice)||0;return `<tr><td>${esc(p.Code||p.ProductID)}</td><td>${esc(p.Description)}</td><td>${esc(p.Brand)}</td><td class="${q<=Number(p.MinStock)&&Number(p.MinStock)>0?'status-low':''}">${money(q)}</td><td>${money(p.MinStock)}</td><td>${money(c)}</td><td>${money(q*c)}</td></tr>`}).join('')}
async function customers(){state.customers=await call('apiCustomers');renderParties('Customers',state.customers,['CustomerID','Name','Phone','WhatsApp','CreditLimit','OpeningBalance','ClosingBalance'])}
async function suppliers(){state.suppliers=await call('apiSuppliers');renderParties('Suppliers',state.suppliers,['SupplierID','Name','Phone','Email','OpeningBalance','ClosingBalance'])}
function renderParties(title,rows,cols){$('#content').innerHTML=`<div class="content"><div class="panel"><div class="panel-head"><h2>${title} (${rows.length})</h2><input id="search" class="search" placeholder="Search..." oninput="filterParty()"></div><div class="table-wrap"><table class="table"><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody id="partyRows"></tbody></table></div></div></div>`;drawParty(rows,cols)}
function filterParty(){const q=$('#search').value.toLowerCase();const rows=(state.page==='customers'?state.customers:state.suppliers).filter(x=>Object.values(x).join(' ').toLowerCase().includes(q));drawParty(rows,Object.keys(rows[0]||{}).filter(k=>state.page==='customers'?['CustomerID','Name','Phone','WhatsApp','CreditLimit','OpeningBalance','ClosingBalance'].includes(k):['SupplierID','Name','Phone','Email','OpeningBalance','ClosingBalance'].includes(k)))}
function drawParty(rows,cols){$('#partyRows').innerHTML=rows.slice(0,500).map(r=>`<tr>${cols.map(c=>`<td>${esc(r[c])}</td>`).join('')}</tr>`).join('')||'<tr><td colspan="10" class="empty">No records</td></tr>'}
async function ledger(){const customers=state.customers.length?state.customers:await call('apiCustomers');const suppliers=state.suppliers.length?state.suppliers:await call('apiSuppliers');const all=[...customers.map(x=>({...x,_type:'customer',_id:x.CustomerID})),...suppliers.map(x=>({...x,_type:'supplier',_id:x.SupplierID}))];$('#content').innerHTML=`<div class="content"><div class="panel"><div class="panel-head"><h2>Party Ledger</h2><div class="toolbar"><select id="party" class="search"><option value="">Select customer / supplier</option>${all.map(x=>`<option value="${x._type}|${x._id}">${esc(x.Name)} — ${x._type}</option>`).join('')}</select><button class="btn primary" onclick="loadLedger()">Open Ledger</button></div></div><div id="ledgerBox" class="empty">Select an account to view ledger.</div></div></div>`}
async function loadLedger(){const v=$('#party').value;if(!v)return toast('Select an account first');const [type,id]=v.split('|');const rows=await call('apiLedger',type,id);$('#ledgerBox').innerHTML=`<div class="table-wrap"><table class="table"><thead><tr><th>Date</th><th>Particular</th><th>Ref</th><th>Debit</th><th>Credit</th><th>Balance</th><th>Type</th></tr></thead><tbody>${rows.map(r=>`<tr><td>${esc(r.Date)}</td><td>${esc(r.Particular)}</td><td>${esc(r.Ref)}</td><td>${money(r.Debit)}</td><td>${money(r.Credit)}</td><td>${money(r.Balance)}</td><td><span class="badge">${esc(r.Type)}</span></td></tr>`).join('')||'<tr><td colspan="7" class="empty">No ledger entries</td></tr>'}</tbody></table></div>`}
function setPage(p){state.page=p;document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.page===p));const title=p.charAt(0).toUpperCase()+p.slice(1);$('#pageTitle').textContent=title;$('#crumb').textContent=title;load()}
document.addEventListener('DOMContentLoaded',()=>{document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>setPage(b.dataset.page));$('#refreshBtn').onclick=load;load()});
</script>
